[project]
name = "fusion-simulation"
version = "0.1.1"
description = "Fusion-Simulation — Robot virtual simulation training and testing platform for Apple Silicon"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "pybullet>=3.2.5",
    "defusedxml>=0.7.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
fusion-sim = "fusion_simulation.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["fusion_simulation*"]

[tool.coverage.run]
source = ["fusion_simulation"]
omit = [
    "fusion_simulation/service/proto/simulation_pb2.py",
    "fusion_simulation/service/proto/simulation_pb2_grpc.py",
    "fusion_simulation/service/proto/__init__.py",
    "fusion_simulation/bench.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "pass",
]