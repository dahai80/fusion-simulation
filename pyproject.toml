[project]
name = "fusion-simulation"
version = "0.1.2"
description = "Fusion-Simulation — Robot virtual simulation training and testing platform for Apple Silicon"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "pybullet>=3.2.5",
    "defusedxml>=0.7.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
fusion-sim = "fusion_simulation.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    "fusion_simulation/service/proto/simulation_pb2.py",
    "fusion_simulation/service/proto/simulation_pb2_grpc.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PERF", "RUF"]
ignore = [
    "BLE001",
    "SIM117",
    "RUF059",
    "S110",
    "B017",
    "E501",
    "UP042",
    "B007",
    "B905",
    "PERF401",
    "PERF102",
    "SIM102",
    "SIM103",
    "SIM105",
    "SIM108",
    "SIM110",
    "RUF002",
    "RUF006",
    "F841",
    "E402",
    "E731",
]

[tool.ruff.lint.isort]
known-first-party = ["fusion_simulation"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["fusion_simulation*"]

[tool.coverage.run]
source = ["fusion_simulation"]
omit = [
    "fusion_simulation/service/proto/simulation_pb2.py",
    "fusion_simulation/service/proto/simulation_pb2_grpc.py",
    "fusion_simulation/service/proto/__init__.py",
    "fusion_simulation/bench.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "pass",
]